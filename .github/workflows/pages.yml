name: Publish exhibit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Assemble the public static site
        shell: bash
        run: |
          site="$RUNNER_TEMP/pages-site"
          mkdir -p "$site"
          git archive HEAD -- . ':(exclude).github' | tar -x -C "$site"
          test -s "$site/index.html"
          test -s "$site/demo/index.html"
          test -s "$site/demo/d10.html"
          test -s "$site/manuscript/Isolation_Game_Research_Report.pdf"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
