  <style>

    #board line { stroke: #819287; stroke-width: 2; }

    #board circle { fill: var(--card); stroke: var(--green); stroke-width: 2; }
    #board .covered circle { fill: #d5e1d3; }
    #board .best circle { stroke: var(--blue); stroke-width: 4; }
    #board [data-i]:focus-visible circle { stroke: #50388c; stroke-width: 4; }

    #board text { text-anchor: middle; dominant-baseline: central; fill: var(--ink); font: 700 15px system-ui, sans-serif; pointer-events: none; }

    .key-live { height: 0; border: 2px solid #b44c2e; border-radius: 2px; }
    .key-covered { background: #d5e1d3; border: 1px solid #657e6e; }
    .key-best { border: 2px solid var(--blue); }
    .actions, .sequence { display: flex; flex-wrap: wrap; gap: .42rem; }
    .moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.35rem, 1fr)); gap: .42rem; }
    .actions { margin-top: .9rem; }
    #optimal { background: var(--green); color: white; border-color: var(--green); }
    #optimal:hover:not(:disabled) { background: #19493b; }
    .aside { align-self: start; }
    .aside section + section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .aside p, .history-block p { color: var(--muted); font-size: .89rem; margin-top: .4rem; }
    .opening-values, .sequence, .moves { margin-top: .55rem; }
    .opening-values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
    .opening-values div { padding: .45rem .6rem; border-radius: .5rem; background: #edf1e9; }
    .opening-values span { display: block; color: var(--muted); font-size: .85rem; }
    .opening-values b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .move.best { border: 2px solid var(--blue); color: var(--blue); font-weight: 700; padding: .36rem .44rem; }
    .move { padding-inline: .5rem; font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sequence { list-style: none; padding: 0; }
    .ply { border-radius: .35rem; padding: .15rem .45rem; font-size: .87rem; font-weight: 700; background: #e0efe6; }
    .ply[data-player="S"] { background: #f2e6da; color: #68371e; }
    .history-block { margin-top: 1rem; }
    .history-block p { overflow-wrap: anywhere; }
    details { margin-top: .9rem; color: var(--muted); font-size: .9rem; }
    summary { width: fit-content; color: var(--ink); font-weight: 650; }
    details p { margin-top: .5rem; }

    body { background: #f3f2e9; }
    main { max-width: 82rem; }
    .header { align-items: end; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line); }
    .eyebrow { color: #9a4a2c; text-transform: uppercase; font-size: .76rem; font-weight: 750; letter-spacing: .13em; margin-bottom: .45rem; }
    .intro { max-width: 42rem; font-size: 1.06rem; }
    .language { background: #fffefa; border: 1px solid var(--line); padding: .55rem .7rem; border-radius: .65rem; }
    .guide { margin: 1.4rem 0; }
    .guide-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
    .guide h2 { font: 600 clamp(1.3rem,2.5vw,1.7rem)/1.2 Georgia, serif; }
    .guide-head p { color: var(--muted); font-size: .91rem; }
    .steps { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .7rem; margin-top: .85rem; }
    .step { background: #fffefa; border: 1px solid var(--line); border-radius: .7rem; padding: 1rem; }
    .step b { display: block; color: var(--green); font-size: .98rem; }
    .step b::before { content: attr(data-number); display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: #dceade; margin-right: .5rem; font-size: .82rem; }
    .step p { color: var(--muted); font-size: .9rem; margin-top: .5rem; }
    .example { margin-top: .7rem; display: grid; grid-template-columns: auto 1fr; gap: .8rem 1.2rem; align-items: center; background: #e7eee2; border-radius: .7rem; padding: .9rem 1rem; }
    .example strong { display: block; color: var(--green); }
    .example p { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; }
    .path-illustration { display: flex; align-items: center; color: #637c6c; white-space: nowrap; }
    .path-illustration i { width: .8rem; height: 2px; background: #829888; }
    .path-illustration i.live { height: 3px; background: #b44c2e; }
    .path-illustration span { display: grid; place-items: center; width: 1.7rem; height: 1.7rem; background: #fffefa; border: 1.5px solid var(--green); border-radius: 50%; font-size: .76rem; font-weight: 700; }
    .path-illustration span.mark { background: #cddfcb; }
    .settings { padding-top: .1rem; }
    .board-heading { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: .35rem; }
    .board-heading h2 { font-size: 1.15rem; }
    .board-heading p { color: var(--muted); font-size: .86rem; }
    .aside { border-top: 4px solid #346b57; }
    .aside > h2 { font-size: 1.05rem; }
    .aside > p { color: var(--muted); font-size: .88rem; margin-top: .3rem; }
    .project-nav { display:flex; gap: 1rem; flex-wrap:wrap; margin-top: 1.4rem; font-size:.9rem; }
    a { color: #145641; text-underline-offset: .2em; }
    @media (max-width: 40rem) { .steps { grid-template-columns: 1fr; } .example { grid-template-columns: 1fr; } .path-illustration { justify-content: center; } .settings label { max-width: 100%; } .settings select { max-width: 100%; min-width: 0; } #board circle { r: 21px; } #board text { font-size: 22px; } }
    @media (max-width: 51rem) { .workspace { grid-template-columns: minmax(0, 1fr); } }

</head>
<body>
<main>
  <header class="header">
    <div>
      <p class="eyebrow" data-copy="eyebrow"></p>
      <h1 data-copy="title">树上的隔离博弈</h1>
      <p class="intro" data-copy="intro"></p>
    </div>
    <label class="language"><span aria-hidden="true">🌐</span> <span data-copy="language"></span>
      <select id="language">
        <option value="zh" lang="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="ja" lang="ja">日本語</option><option value="es" lang="es">Español</option><option value="fr" lang="fr">Français</option><option value="de" lang="de">Deutsch</option><option value="pt" lang="pt">Português</option>
      </select>
    </label>
  </header>
  <section class="guide" aria-labelledby="guide-title">
    <div class="guide-head"><h2 id="guide-title" data-copy="guideTitle"></h2><p data-copy="guideLead"></p></div>
    <div class="steps">
      <article class="step"><b data-number="1" data-copy="step1Title"></b><p data-copy="step1"></p></article>
      <article class="step"><b data-number="2" data-copy="step2Title"></b><p data-copy="step2"></p></article>
      <article class="step"><b data-number="3" data-copy="step3Title"></b><p data-copy="step3"></p></article>
    </div>
    <div class="example">
      <div class="path-illustration" aria-hidden="true"><span class="mark">1</span><i></i><span class="mark">2</span><i></i><span class="mark">3</span><i></i><span>4</span><i class="live"></i><span>5</span></div>
      <div><strong data-copy="exampleTitle"></strong><p data-copy="example"></p></div>
    </div>
  </section>
  <div class="settings">
    <label><span data-copy="tree"></span>
      <select id="tree">
        <option value="5" data-copy="p5"></option>
        <option value="9" data-copy="p9"></option>
        <option value="22" data-copy="d8"></option>
        <option value="23" data-copy="d8Leaf"></option>
      </select>
    </label>
    <label><span data-copy="starter"></span>
      <select id="start">
        <option value="D">D</option>
        <option value="S">S</option>
      </select>
    </label>
  </div>
  <div class="workspace">
    <section class="panel board-panel" aria-label="棋盘" id="board-panel">
      <div class="board-heading"><h2 data-copy="boardTitle"></h2><p data-copy="boardHint"></p></div>
      <output id="status" class="status" role="status" aria-atomic="true"></output>
      <svg id="board" viewBox="0 0 640 320" role="group" aria-label="树"></svg>
      <div class="legend">
        <span><i class="key key-live" aria-hidden="true"></i><span data-copy="openEdge"></span></span>
        <span><i class="key key-covered" aria-hidden="true"></i><span data-copy="coveredVertex"></span></span>
        <span><i class="key key-best" aria-hidden="true"></i><span data-copy="optimalRing"></span></span>
      </div>
      <div class="actions">
        <button id="optimal" data-copy="playBest"></button>
        <button id="undo" data-copy="undo"></button>
        <button id="reset" data-copy="restart"></button>
      </div>
      <div class="history-block">
        <h2 data-copy="history"></h2><p id="history"></p>
      </div>
      <details>
        <summary data-copy="rulesTitle"></summary>
        <p data-copy="rule"></p><p data-copy="goal"></p>
      </details>
    </section>
    <aside class="panel aside" id="analysis">
      <h2 data-copy="analysisTitle"></h2><p data-copy="analysisIntro"></p>
      <section>
        <h2 data-copy="openingValues"></h2>
        <div class="opening-values">
          <div><span data-copy="dStart"></span><b id="d-value"></b></div>
          <div><span data-copy="sStart"></span><b id="s-value"></b></div>
        </div>
      </section>
      <section>
        <h2 data-copy="optimalLine"></h2>
        <p data-copy="lineHelp"></p>
        <ol id="line" class="sequence"></ol>
        <p id="no-line" hidden data-copy="noLine"></p>
      </section>
      <section>
        <h2 data-copy="legalMoves"></h2>
        <p id="move-help" data-copy="moveHelp"></p>
        <div id="moves" class="moves" aria-describedby="move-help"></div>
      </section>
    </aside>
  </div>
  <nav class="project-nav"><a id="construction-link" href="d10.html" data-copy="constructionLink"></a><a href="../" data-copy="homeLink"></a></nav>
</main>

  const playerName = isStaller => isStaller ? "S" : "D";
  const label = i => n <= 9 ? i + 1 : i;
  let n, edges, points, neighbors, memo, record, covered, staller;

  function newGame() {
    n = Number(el("tree").value);
    edges = [];
    points = [];
    memo = new Map();
    record = [];
    covered = 0;
    staller = el("start").value === "S";
    if (n <= 9) {
      for (let i = 0; i < n; i++) {
        points.push([60 + 520 * i / (n - 1), 160]);
        if (i) edges.push([i - 1, i]);
      }
    } else {
      points.push([320, 151]);
      for (let arm = 0; arm < 3; arm++) {
        const angle = (arm * 120 - 90) * Math.PI / 180;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const first = 1 + 7 * arm;
        for (let j = 0; j < 7; j++) {
          points.push([320 + 190 * dx - 53 * (j - 3) * dy, 151 + 112 * dy + 31 * (j - 3) * dx]);
          if (j) edges.push([first + j - 1, first + j]);
        }
        edges.push([0, first + 3]);
      }
      if (n === 23) {
        points.push([320, 221]);
        edges.push([0, 22]);
      }
    }
    neighbors = points.map((_, i) => 1 << i);
    for (const [a, b] of edges) {
      neighbors[a] |= 1 << b;
      neighbors[b] |= 1 << a;
    }
    render();
  }

  function targets(mask) {
    let active = 0;
    for (const [a, b] of edges) {
      const edge = (1 << a) | (1 << b);
      if (!(mask & edge)) active |= edge;
    }
    return active;
  }

  function value(mask, isStaller) {
    const key = 2 * mask + Number(isStaller);
    if (memo.has(key)) return memo.get(key);
    const active = targets(mask);
    let result = 0;
    if (active) {
      result = isStaller ? 0 : Infinity;
      for (const hood of neighbors) {
        if (hood & active) {
          const cost = 1 + value(mask | hood, !isStaller);
          result = isStaller ? Math.max(result, cost) : Math.min(result, cost);
        }
      }
    }
    memo.set(key, result);
    return result;
  }

  function moveValues(mask, isStaller) {
    const active = targets(mask);
    return neighbors.map(hood => hood & active ? 1 + value(mask | hood, !isStaller) : null);
  }

  function optimalLine(mask, isStaller) {
    const line = [];
    while (targets(mask)) {
      const best = value(mask, isStaller);
      const index = moveValues(mask, isStaller).indexOf(best);
      line.push({ player: playerName(isStaller), index });
      mask |= neighbors[index];
      isStaller = !isStaller;
    }
    return line;
  }

  function play(index) {
    if (!(targets(covered) & neighbors[index])) return;
    const focusArea = el("board").contains(document.activeElement) ? el("board")
      : el("moves").contains(document.activeElement) ? el("moves") : null;
    record.push({ index, covered, staller });
    covered |= neighbors[index];
    staller = !staller;
    render();
    if (focusArea) {
      const next = focusArea.querySelector('[data-i]:not([aria-disabled="true"])');
      (next || el("undo")).focus();
    }
  }

  function render() {
    const strings = copy();
    const best = value(covered, staller);
    const choices = moveValues(covered, staller);
    el("d-value").textContent = value(0, false);
    el("s-value").textContent = value(0, true);
    el("status").textContent = best ? strings.turn(playerName(staller), best) : strings.end(record.length);
    el("history").textContent = record.length
      ? record.map(move => playerName(move.staller) + " " + label(move.index)).join(" → ")
      : strings.noMoves;
    el("optimal").disabled = best === 0;
    el("undo").disabled = record.length === 0;

    const lines = edges.map(([a, b]) => {
      const [x1, y1] = points[a];
      const [x2, y2] = points[b];
      const open = (covered & ((1 << a) | (1 << b))) === 0;
      return '<line class="' + (open ? 'live' : '') + '" x1="' + x1 + '" y1="' + y1 +
        '" x2="' + x2 + '" y2="' + y2 + '"></line>';
    });
    const vertices = points.map(([x, y], i) => {
      const legal = choices[i] !== null;
      const optimal = choices[i] === best;
      const classes = [covered & (1 << i) ? "covered" : "", optimal ? "best" : ""].join(" ");
      return '<g role="button" data-i="' + i + '" aria-label="' + strings.vertex(label(i), optimal) +
        '" aria-disabled="' + !legal + '" tabindex="' + (legal ? 0 : -1) + '" class="' + classes +
        '"><circle cx="' + x + '" cy="' + y + '" r="14"></circle><text x="' + x + '" y="' + y +
        '">' + label(i) + '</text></g>';
    });
    el("board").innerHTML = lines.concat(vertices).join("");

    el("moves").replaceChildren();
    choices.forEach((cost, index) => {
      if (cost === null) return;
      const b = document.createElement("button");
      b.className = cost === best ? "move best" : "move";
      b.dataset.i = index;
      b.textContent = label(index) + " → " + cost;
      b.setAttribute("aria-label", strings.vertex(label(index), cost === best) + " → " + cost);
      el("moves").append(b);
    });

    const line = optimalLine(covered, staller);
    el("line").replaceChildren(...line.map(move => {
      const item = document.createElement("li");
      item.className = "ply";
      item.dataset.player = move.player;
      item.dataset.vertex = move.index;
      item.textContent = move.player + " " + label(move.index);
      return item;
    }));
    el("no-line").hidden = line.length !== 0;
  }

  function choose(event) {
    const vertex = event.target.closest("[data-i]");
    if (vertex && vertex.getAttribute("aria-disabled") !== "true") play(Number(vertex.dataset.i));
  }

  function updateLanguage() {
    const strings = copy();
    document.documentElement.lang = el("language").value === "zh" ? "zh-Hans" : el("language").value;
    el("language").setAttribute("aria-label", strings.language);
    el("construction-link").href = "d10.html?lang=" + encodeURIComponent(el("language").value);
    document.title = strings.title;
    document.querySelectorAll("[data-copy]").forEach(node => { node.textContent = strings[node.dataset.copy]; });
    el("board").setAttribute("aria-label", strings.board);
    el("board-panel").setAttribute("aria-label", strings.boardPanel);
    el("analysis").setAttribute("aria-label", strings.analysis);
  }

  el("board").addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    choose(event);
  });

    if (!previous) return;
    covered = previous.covered;
    staller = previous.staller;

  });

    updateLanguage();
    render();
  });

  updateLanguage();
