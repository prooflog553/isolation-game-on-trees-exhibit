<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>树上的隔离博弈</title>
  <style>
:root {
  color-scheme: light;
  --ink: #132b37;
  --muted: #526873;
  --navy: #122d3b;
  --teal: #176459;
  --mint: #d9eee5;
  --paper: #eff3f2;
  --card: #fff;
  --edge: #b2462c;
  --blue: #175a9e;
  --line: #d9e4e5;
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
main { width: min(100%, 78rem); margin: auto; padding: clamp(.75rem, 3.5vw, 2.5rem); }
h1, h2, p { margin: 0; }
h1 { font: 550 clamp(1.85rem, 4.5vw, 3.45rem)/1.08 Georgia, "Songti SC", serif; }
h2 { font-size: 1.05rem; line-height: 1.25; }
.header {
  background: radial-gradient(ellipse at 98% 5%, #285665 0, transparent 52%), var(--navy);
  color: #fff; padding: clamp(1.15rem, 4vw, 2.85rem); border-radius: 1.1rem;
  display: flex; justify-content: space-between; gap: .8rem 1.5rem; flex-wrap: wrap; align-items: start;
}
.intro { margin-top: .7rem; color: #cde0e3; max-width: 44rem; }
label { display: inline-flex; align-items: center; gap: .55rem; font-size: .92rem; font-weight: 650; }
.language { align-self: start; }
.language select { background: #f1f8f6; }
select, button {
  color: var(--ink); font: inherit; min-height: 2.6rem; padding: .5rem .7rem;
  background: var(--card); border: 1px solid #a3b8bc; border-radius: .55rem; max-width: 100%;
}
button, select, summary { cursor: pointer; }
button:hover:not(:disabled) { background: #e8f4ef; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid #326bbb; outline-offset: 3px; }
.settings { display: flex; gap: .6rem 1.2rem; margin: 1rem 0; flex-wrap: wrap; }
.workspace { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); align-items: start; gap: 1rem; }
.panel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: clamp(.75rem, 2vw, 1.15rem); box-shadow: 0 3px 12px #183b4c0a; }
.board-heading { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.board-heading p, .subtle, .aside p { color: var(--muted); font-size: .89rem; }
.turnbar { display: flex; justify-content: space-between; align-items: center; gap: .4rem .7rem; flex-wrap: wrap; margin: .7rem 0 .55rem; }
.status { display: block; font-weight: 730; color: var(--teal); }
.edge-count { display: block; background: #fbece4; color: #8b351f; border-radius: .32rem; padding: .2rem .48rem; font-size: .83rem; font-weight: 650; }
.lesson {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .55rem .85rem;
  background: #e6f3ef; border-left: 3px solid #268174; border-radius: .55rem;
  padding: .58rem .7rem; margin: .65rem 0;
}
.lesson p { flex: 1 1 10rem; font-size: .92rem; }
.lesson button { border-color: #5c9389; background: #f8fdfb; color: #164e45; font-weight: 680; }
.lesson button:hover { background: #d1ece2; }
#board { display: block; width: 100%; height: auto; border-radius: .65rem; background: #f4f8f7; }
#board line { stroke: #94a8a7; stroke-width: 2; }
#board .live { stroke: var(--edge); stroke-width: 4; }
#board circle { fill: #fff; stroke: #376a63; stroke-width: 2; }
#board .covered circle { fill: var(--mint); }
#board .chosen circle { stroke-dasharray: 2.4 2.4; }
#board .last circle { fill: #abd8ca; }
#board .best circle { stroke: var(--blue); stroke-width: 4; }
#board .suggested circle { stroke: #71438d; stroke-width: 5; stroke-dasharray: 5 3; }
#board [data-i]:focus-visible circle { stroke: #512b7b; stroke-width: 4; }
#board [aria-disabled="false"] { cursor: pointer; }
#board [aria-disabled="false"]:hover circle { fill: #d9e9fe; }
#board text { text-anchor: middle; dominant-baseline: central; fill: var(--ink); font: 720 16px system-ui, sans-serif; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; color: var(--muted); font-size: .83rem; padding-top: .65rem; }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.key { width: .82rem; height: .82rem; display: inline-block; border-radius: 50%; }
.key-live { height: 0; border: 2px solid var(--edge); border-radius: 2px; }
.key-covered { background: var(--mint); border: 1px solid #638a80; }
.key-best { border: 2px solid var(--blue); }
.impact { min-height: 1.4rem; color: #37625b; font-size: .9rem; margin-top: .6rem; }
.impact:empty { display: none; }
.actions, .sequence { display: flex; flex-wrap: wrap; gap: .45rem; }
.actions { margin-top: .55rem; }
#optimal { background: var(--teal); color: white; border-color: var(--teal); font-weight: 690; }
#optimal:hover:not(:disabled) { background: #104c46; }
.legal { margin-top: .95rem; padding-top: .85rem; border-top: 1px solid var(--line); }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: .4rem; margin-top: .55rem; }
.move { padding: .35rem .38rem; min-height: 2.55rem; font-size: .87rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.move.best { border: 2px solid var(--blue); color: var(--blue); background: #f3f8ff; font-weight: 700; }
.subtle { margin-top: .35rem; }
.aside { border-top: 4px solid #377b71; }
.aside section + section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.opening-values { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .55rem; margin-top: .55rem; }
.opening-values div { padding: .6rem .7rem; border-radius: .5rem; background: #eaf4f2; }
.opening-values div:last-child { background: #fcf1e7; }
.opening-values span { display: block; font-size: .84rem; color: var(--muted); }
.opening-values b { font: 600 1.7rem Georgia, serif; font-variant-numeric: tabular-nums; }
.sequence { list-style: none; padding: 0; margin: .6rem 0 0; }
.ply { border-radius: 1rem; padding: .18rem .55rem; font-size: .84rem; font-weight: 700; background: #dbefe8; }
.ply[data-player="S"] { background: #fae9dd; color: #793d24; }
.history-block { margin-top: 1rem; }
#history { overflow-wrap: anywhere; }
.rules { margin-top: 1rem; background: #f8fbfa; }
summary { color: var(--ink); font-weight: 730; }
.steps { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1rem; margin: .8rem 0; }
.step p, .example p { color: var(--muted); margin-top: .25rem; font-size: .9rem; }
.example { border-top: 1px solid var(--line); padding-top: .7rem; }
.project-nav { display: flex; flex-wrap: wrap; gap: .75rem 1.3rem; margin-top: 1.1rem; font-size: .9rem; }
a { color: #1a5e58; text-underline-offset: .2em; }
@media (max-width: 47rem) { .workspace { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 36rem) {
  .header { border-radius: .8rem; }
  .settings label { min-width: 0; flex: 1 1 10rem; flex-wrap: wrap; }
  .settings select { width: 100%; }
  .steps { grid-template-columns: 1fr; gap: .6rem; }
  #board circle { r: 21px; }
  #board text { font-size: 23px; }
  .move { min-height: 2.75rem; }
}
  </style>
</head>
<body>
<main>
  <header class="header">
    <div>
      <h1 data-copy="title">树上的隔离博弈</h1>
      <p class="intro" data-copy="intro"></p>
    </div>
    <label class="language"><span data-copy="language"></span>
      <select id="language">
        <option value="zh" lang="zh-Hans">简体中文</option>
        <option value="en" lang="en">English</option>
        <option value="ja" lang="ja">日本語</option>
        <option value="es" lang="es">Español</option>
        <option value="fr" lang="fr">Français</option>
        <option value="de" lang="de">Deutsch</option>
        <option value="pt" lang="pt">Português</option>
      </select>
    </label>
  </header>
  <div class="settings">
    <label><span data-copy="tree"></span>
      <select id="tree">
        <option value="5" data-copy="p5"></option>
        <option value="9" data-copy="p9"></option>
        <option value="22" data-copy="d8"></option>
        <option value="23" data-copy="d8Leaf"></option>
      </select>
    </label>
    <label><span data-copy="starter"></span>
      <select id="start">
        <option value="D">Dominator (D)</option>
        <option value="S">Staller (S)</option>
      </select>
    </label>
  </div>
  <div class="workspace">
    <section class="panel board-panel" id="board-panel">
      <div class="board-heading"><h2 data-copy="boardTitle"></h2><p id="board-hint"></p></div>
      <div class="turnbar">
        <output id="status" class="status" role="status" aria-atomic="true"></output>
        <output id="edge-count" class="edge-count"></output>
      </div>
      <div class="lesson">
        <p id="lesson-text" role="status" aria-atomic="true"></p>
        <button id="learn" type="button"></button>
      </div>
      <svg id="board" viewBox="0 0 640 320" role="group"></svg>
      <div class="legend">
        <span><i class="key key-live" aria-hidden="true"></i><span data-copy="openEdge"></span></span>
        <span><i class="key key-covered" aria-hidden="true"></i><span data-copy="coveredVertex"></span></span>
        <span><i class="key key-best" aria-hidden="true"></i><span data-copy="optimalRing"></span></span>
      </div>
      <p id="impact" class="impact" aria-live="polite"></p>
      <div class="actions">
        <button id="optimal" data-copy="playBest"></button>
        <button id="undo" data-copy="undo"></button>
        <button id="reset" data-copy="restart"></button>
      </div>
      <section class="legal">
        <h2 data-copy="legalMoves"></h2>
        <p id="move-help" class="subtle" data-copy="moveHelp"></p>
        <div id="moves" class="moves" aria-describedby="move-help"></div>
      </section>
    </section>
    <aside class="panel aside" id="analysis">
      <section>
        <h2 data-copy="openingValues"></h2>
        <div class="opening-values">
          <div><span data-copy="dStart"></span><b id="d-value"></b></div>
          <div><span data-copy="sStart"></span><b id="s-value"></b></div>
        </div>
      </section>
      <section>
        <h2 data-copy="optimalLine"></h2>
        <p class="subtle" data-copy="lineHelp"></p>
        <ol id="line" class="sequence"></ol>
        <p id="no-line" hidden data-copy="noLine"></p>
      </section>
      <section class="history-block">
        <h2 data-copy="history"></h2><p id="history" class="subtle"></p>
      </section>
    </aside>
  </div>
  <details class="panel rules">
    <summary data-copy="rulesTitle"></summary>
    <div class="steps">
      <article class="step"><b data-copy="step1Title"></b><p data-copy="step1"></p></article>
      <article class="step"><b data-copy="step2Title"></b><p data-copy="step2"></p></article>
      <article class="step"><b data-copy="step3Title"></b><p data-copy="step3"></p></article>
    </div>
    <div class="example"><strong data-copy="exampleTitle"></strong><p data-copy="example"></p></div>
  </details>
  <nav class="project-nav"><a id="construction-link" href="d10.html" data-copy="constructionLink"></a><a id="home-link" href="../" data-copy="homeLink"></a></nav>
</main>

  function lessonStage() {
    if (!guided) return 0;
    if (!record.length) return 1;
    if (record[0].index === 1 && record.length === 1) return 2;
    if (record[0].index === 1 && record[1]?.index === 2 && record.length === 2) return 3;
    return 4;
  }

  function openEdges(mask) {
    return edges.filter(([a, b]) => (mask & ((1 << a) | (1 << b))) === 0).length;
  }

  function newGame(showLesson = false) {
    guided = showLesson === true;
    n = Number(el("tree").value);
    el("board").setAttribute("viewBox", n <= 9 ? "0 88 640 144" : "0 0 640 320");
    edges = [];
    points = [];
    memo = new Map();
    record = [];
    covered = 0;
    staller = el("start").value === "S";
    if (n <= 9) {
      for (let i = 0; i < n; i++) {
        points.push([60 + 520 * i / (n - 1), 160]);
        if (i) edges.push([i - 1, i]);
      }
    } else {
      points.push([320, 151]);
      for (let arm = 0; arm < 3; arm++) {
        const angle = (arm * 120 - 90) * Math.PI / 180;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const first = 1 + 7 * arm;
        for (let j = 0; j < 7; j++) {
          points.push([320 + 190 * dx - 53 * (j - 3) * dy, 151 + 112 * dy + 31 * (j - 3) * dx]);
          if (j) edges.push([first + j - 1, first + j]);
        }
        edges.push([0, first + 3]);
      }
      if (n === 23) {
        points.push([320, 221]);
        edges.push([0, 22]);
      }
    }
    neighbors = points.map((_, i) => 1 << i);
    for (const [a, b] of edges) {
      neighbors[a] |= 1 << b;
      neighbors[b] |= 1 << a;
    }
    render();
  }

  function targets(mask) {
    let active = 0;
    for (const [a, b] of edges) {
      const edge = (1 << a) | (1 << b);
      if (!(mask & edge)) active |= edge;
    }
    return active;
  }

  function value(mask, isStaller) {
    const key = 2 * mask + Number(isStaller);
    if (memo.has(key)) return memo.get(key);
    const active = targets(mask);
    let result = 0;
    if (active) {
      result = isStaller ? 0 : Infinity;
      for (const hood of neighbors) {
        if (hood & active) {
          const cost = 1 + value(mask | hood, !isStaller);
          result = isStaller ? Math.max(result, cost) : Math.min(result, cost);
        }
      }
    }
    memo.set(key, result);
    return result;
  }

  function moveValues(mask, isStaller) {
    const active = targets(mask);
    return neighbors.map(hood => hood & active ? 1 + value(mask | hood, !isStaller) : null);
  }

  function optimalLine(mask, isStaller) {
    const line = [];
    while (targets(mask)) {
      const best = value(mask, isStaller);
      const index = moveValues(mask, isStaller).indexOf(best);
      line.push({ player: playerName(isStaller), index });
      mask |= neighbors[index];
      isStaller = !isStaller;
    }
    return line;
  }

  function play(index) {
    if (!(targets(covered) & neighbors[index])) return;
    const focusArea = el("board").contains(document.activeElement) ? el("board")
      : el("moves").contains(document.activeElement) ? el("moves") : null;
    record.push({ index, covered, staller });
    covered |= neighbors[index];
    staller = !staller;
    render();
    if (focusArea) {
      const next = focusArea.querySelector('[data-i]:not([aria-disabled="true"])');
      (next || el("undo")).focus();
    }
  }

  function render() {
    const strings = copy();
    const language = el("language").value;
    const ui = interfaceCopy[language];
    const stage = lessonStage();
    const suggested = stage === 1 || stage === 2 ? stage : null;
    const live = openEdges(covered);
    const last = record.at(-1);
    const best = value(covered, staller);
    const choices = moveValues(covered, staller);
    el("d-value").textContent = value(0, false);
    el("s-value").textContent = value(0, true);
    el("status").textContent = best ? strings.turn(playerName(staller), best) : strings.end(record.length);
    el("history").textContent = record.length
      ? record.map(move => playerName(move.staller) + " " + label(move.index)).join(" → ")
      : strings.noMoves;
    el("optimal").disabled = best === 0;
    el("undo").disabled = record.length === 0;
    el("edge-count").textContent = ui.edges(live);
    el("lesson-text").textContent = ui.prompt[stage];
    el("learn").textContent = suggested === null ? (stage === 0 ? ui.start : ui.restart) : ui.play(label(suggested));
    if (last) {
      const changed = points.flatMap((_, i) => ((covered ^ last.covered) & (1 << i)) ? [label(i)] : []);
      const separator = language === "zh" || language === "ja" ? "、" : ", ";
      el("impact").textContent = ui.impact(label(last.index), changed.join(separator), openEdges(last.covered) - live);
    } else {
      el("impact").textContent = "";
    }

    const lines = edges.map(([a, b]) => {
      const [x1, y1] = points[a];
      const [x2, y2] = points[b];
      const open = (covered & ((1 << a) | (1 << b))) === 0;
      return '<line class="' + (open ? 'live' : '') + '" x1="' + x1 + '" y1="' + y1 +
        '" x2="' + x2 + '" y2="' + y2 + '"></line>';
    });
    const played = new Set(record.map(move => move.index));
    const vertices = points.map(([x, y], i) => {
      const legal = choices[i] !== null;
      const optimal = choices[i] === best;
      const classes = [
        covered & (1 << i) ? "covered" : "",
        optimal ? "best" : "",
        played.has(i) ? "chosen" : "",
        last?.index === i ? "last" : "",
        suggested === i ? "suggested" : ""
      ].join(" ");
      return '<g role="button" data-i="' + i + '" aria-label="' + strings.vertex(label(i), optimal) +
        '" aria-disabled="' + !legal + '" tabindex="' + (legal ? 0 : -1) + '" class="' + classes +
        '"><circle cx="' + x + '" cy="' + y + '" r="14"></circle><text x="' + x + '" y="' + y +
        '">' + label(i) + '</text></g>';
    });
    el("board").innerHTML = lines.concat(vertices).join("");

    el("moves").replaceChildren();
    choices.forEach((cost, index) => {
      if (cost === null) return;
      const b = document.createElement("button");
      b.className = cost === best ? "move best" : "move";
      b.dataset.i = index;
      b.textContent = label(index) + " → " + cost;
      b.setAttribute("aria-label", strings.vertex(label(index), cost === best) + " → " + cost);
      el("moves").append(b);
    });

    const line = optimalLine(covered, staller);
    el("line").replaceChildren(...line.map(move => {
      const item = document.createElement("li");
      item.className = "ply";
      item.dataset.player = move.player;
      item.dataset.vertex = move.index;
      item.textContent = move.player + " " + label(move.index);
      return item;
    }));
    el("no-line").hidden = line.length !== 0;
  }

  function choose(event) {
    const vertex = event.target.closest("[data-i]");
    if (vertex && vertex.getAttribute("aria-disabled") !== "true") play(Number(vertex.dataset.i));
  }

  function updateLanguage() {
    const strings = copy();
    document.documentElement.lang = el("language").value === "zh" ? "zh-Hans" : el("language").value;
    el("language").setAttribute("aria-label", strings.language);
    el("construction-link").href = "d10.html?lang=" + encodeURIComponent(el("language").value);
    document.title = strings.title;
    document.querySelectorAll("[data-copy]").forEach(node => { node.textContent = strings[node.dataset.copy]; });
    el("board").setAttribute("aria-label", strings.board);
    el("board-panel").setAttribute("aria-label", strings.boardPanel);
    el("analysis").setAttribute("aria-label", strings.analysis);
    el("board-hint").textContent = interfaceCopy[el("language").value].hint;
    el("home-link").href = "../?lang=" + encodeURIComponent(el("language").value);
  }

  el("board").addEventListener("click", choose);
  el("board").addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    choose(event);
  });
  el("moves").addEventListener("click", choose);
  el("learn").addEventListener("click", () => {
    const stage = lessonStage();
    if (stage === 1 || stage === 2) {
      play(stage);
      return;
    }
    el("tree").value = "5";
    el("start").value = "D";
    newGame(true);
  });
  el("optimal").addEventListener("click", () => play(moveValues(covered, staller).indexOf(value(covered, staller))));
  el("undo").addEventListener("click", () => {
    const previous = record.pop();
    if (!previous) return;
    covered = previous.covered;
    staller = previous.staller;
    render();
  });
  el("reset").addEventListener("click", newGame);
  el("tree").addEventListener("change", newGame);
  el("start").addEventListener("change", newGame);
  el("language").addEventListener("change", () => {
    updateLanguage();
    render();
  });
  const requestedLanguage = new URLSearchParams(location.search).get("lang");
  if (requestedLanguage && translations[requestedLanguage]) el("language").value = requestedLanguage;
  updateLanguage();
  newGame();
</script>
</body>
</html>
