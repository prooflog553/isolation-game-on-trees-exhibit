<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直径 10 的反例族</title>
  <style>
    :root {
      color-scheme: light;
      font: 1rem/1.5 system-ui, "Segoe UI", sans-serif;
      color: #18312b;
      background: #f5f5ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 72rem; padding: clamp(1rem, 4vw, 3rem); margin: auto; }
    h1 { font: 500 clamp(1.9rem, 5vw, 3rem)/1.12 Georgia, "Songti SC", serif; margin: 0; }
    h2 { font-size: 1.12rem; margin: 0 0 .5rem; }
    p { margin: .5rem 0 0; color: #40594f; }
    header, .controls { display: flex; gap: .7rem 1.2rem; flex-wrap: wrap; align-items: center; }
    header { justify-content: space-between; }
    .controls { margin: 1.2rem 0 .8rem; }
    label { display: inline-flex; align-items: center; gap: .45rem; font-weight: 650; }
    select { border: 1px solid #7b9487; border-radius: .4rem; background: #fffefa; color: inherit; padding: .4rem; font: inherit; }
    :focus-visible { outline: 3px solid #1d6096; outline-offset: 3px; }
    .summary { display: block; font-weight: 700; color: #225545; margin: .2rem 0 1rem; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: .85rem; }
    figure { margin: 0; padding: 1rem; border: 1px solid #cdd5c9; background: #fffefa; border-radius: .7rem; min-width: 0; }
    .viewport { overflow: auto; background: #edf1e5; border-radius: .45rem; }
    svg { display: block; width: calc(100% * var(--zoom, 1)); height: auto; }
    svg line { stroke: #658374; stroke-width: 2.1; }
    svg line.route { stroke: #a04829; stroke-width: 4; }
    svg circle { fill: #fbfdf7; stroke: #2b6552; stroke-width: 2; }
    svg circle.gate { fill: #cadecd; }
    svg circle.hub { fill: #2b6552; }
    svg circle.leaf { fill: #f0c7b3; stroke: #a04829; }
    figcaption { color: #40594f; margin-top: .65rem; }
    .diameter { margin-top: .9rem; padding: .8rem 1rem; border-left: 3px solid #a04829; background: #f1e7dc; }
    .diameter p { color: #533b2f; }
    @media (max-width: 47rem) { .grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
<main>
  <header>
    <h1 data-copy="title">直径 10 的反例族</h1>
    <label>中文 / English
      <select id="language" aria-label="语言 / Language">
        <option value="zh">简体中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>
  <noscript><p>此图需要 JavaScript。 / This diagram requires JavaScript. <a href="../assets/d10-module.svg">静态模块图 / Static module diagram</a></p></noscript>
  <p data-copy="intro"></p>
  <div class="controls">
    <label><span data-copy="parameter"></span><select id="parameter"></select></label>
    <label><span data-copy="zoom"></span>
      <select id="zoom">
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
    </label>
  </div>
  <output id="summary" class="summary" role="status" aria-atomic="true"></output>
  <div class="grid">
    <figure>
      <h2 data-copy="module"></h2>
      <div class="viewport" tabindex="0" role="region" aria-labelledby="module-title">
        <svg id="module" viewBox="0 0 505 300" role="img">
          <title id="module-title"></title>
        </svg>
      </div>
      <figcaption data-copy="moduleCaption"></figcaption>
    </figure>
    <figure>
      <h2 data-copy="star"></h2>
      <div class="viewport" tabindex="0" role="region" aria-labelledby="star-title">
        <svg id="star" viewBox="0 0 400 300" role="img">
          <title id="star-title"></title>
        </svg>
      </div>
      <figcaption data-copy="starCaption"></figcaption>
    </figure>
  </div>
  <section class="diameter">
    <h2 data-copy="diameter"></h2>
    <p data-copy="distance"></p>
    <p data-copy="bound"></p>
    <p><a href="../manuscript/Isolation_Game_Research_Report.pdf#page=59" data-copy="proof"></a></p>
  </section>
</main>
<script>
  const strings = {
    zh: {
      title: "直径 10 的反例族",
      intro: "星形图中的每个点都代表一个模块中心。改变 k，查看模块数量、总顶点数和博弈下界如何变化。",
      parameter: "参数 k", zoom: "图形缩放",
      module: "一个 15 点模块", star: "模块中心组成的星",
      moduleTitle: "一个模块，中心通过两条边连到两条七点路径的中点",
      starTitle: m => "含 " + m + " 个模块中心的星，标出两条相邻于星心的边",
      moduleCaption: "两条互不相交的七点路径各用中点连到一个共有中心。共 1 + 2 × 7 = 15 点，中心到端点最远 4 条边。",
      starCaption: "每个圆点都是一个已有的模块中心，中心之间只加边。橙色的两条边连接两个外围模块的中心。",
      diameter: "为什么直径恰好是 10？",
      distance: "任意两点间至多经过 4 条模块内边、2 条星形连接边、再走 4 条模块内边。选橙色所标两个外围模块中离各自中心最远的端点，恰好走 4 + 2 + 4 = 10 条边。",
      bound: "构造适用于每个正整数 k。91k 是两种先手的下界。图中可以预览 k = 1 到 10。",
      proof: "读论文附录 B 的策略证明",
      summary: (m, n, k) => m + " 个模块 × 15 点 = " + n + " 个顶点 · 直径 10 · 两种先手均至少 " + 91 * k + " 手，上取整基准 " + 90 * k,
    },
    en: {
      title: "The diameter-10 counterexample family",
      intro: "Each point in the star diagram is a module center. Change k to see how the module count, tree order and lower bound grow.",
      parameter: "Parameter k", zoom: "Diagram zoom",
      module: "One 15-vertex module", star: "The star of module centers",
      moduleTitle: "One module, with a center joined to the midpoints of two seven-vertex paths",
      starTitle: m => "Star with " + m + " module centers, showing the two edges through the hub",
      moduleCaption: "Join the midpoints of two disjoint seven-vertex paths to a shared center. The module has 1 + 2 × 7 = 15 vertices. Its tips are four edges from the center.",
      starCaption: "Every point is an existing module center. Joining them adds edges. The orange edges connect the centers of two outer modules through the hub.",
      diameter: "Why is the diameter exactly 10?",
      distance: "A path uses at most 4 edges in its first module, 2 edges in the star and 4 edges in its last module. Choose the farthest tips of the two highlighted outer modules to get exactly 4 + 2 + 4 = 10.",
      bound: "The construction works for every positive integer k. Both starters have a lower bound of 91k moves. The diagram lets you explore k = 1 through 10.",
      proof: "Read the strategy proof in Appendix B",
      summary: (m, n, k) => m + " modules × 15 vertices = " + n + " vertices · diameter 10 · at least " + 91 * k + " moves for either starter, against a ceiling of " + 90 * k,
    },
  };
  const el = id => document.getElementById(id);
  const svg = (tag, attrs) => {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  };
  const edge = ([x1, y1], [x2, y2], highlight) =>
    svg("line", { x1, y1, x2, y2, class: highlight ? "route" : "" });
  const vertex = ([cx, cy], r, className = "") => svg("circle", { cx, cy, r, class: className });

  function drawModule() {
    const center = [72, 150];
    const gates = [[171, 81], [171, 219]];
    const marks = [vertex(center, 12, "hub")];
    const edges = [];
    for (const [i, gate] of gates.entries()) {
      edges.push(edge(center, gate, i === 0));
      marks.push(vertex(gate, 9, "gate"));
      for (const [arm, y] of [gate[1] - 39, gate[1] + 39].entries()) {
        const highlight = i === 0 && arm === 0;
        let parent = gate;
        for (const x of [255, 340, 424]) {
          const point = [x, y];
          edges.push(edge(parent, point, highlight));
          marks.push(vertex(point, 7, highlight && x === 424 ? "leaf" : ""));
          parent = point;
        }
      }
    }
    el("module").append(...edges, ...marks);
  }

  function drawStar(m) {
    const center = [200, 150];
    const outer = Array.from({ length: m - 1 }, (_, i) => {
      const angle = 2 * Math.PI * i / (m - 1) - Math.PI / 2;
      return [center[0] + 123 * Math.cos(angle), center[1] + 123 * Math.sin(angle)];
    });
    const selected = i => i === 0 || i === Math.floor((m - 1) / 2);
    const edges = outer.map((point, i) => edge(center, point, selected(i)));
    const marks = outer.map((point, i) => vertex(point, selected(i) ? 7 : Math.min(4, 200 / m), selected(i) ? "leaf" : ""));
    el("star").replaceChildren(el("star-title"), ...edges, vertex(center, 12, "hub"), ...marks);
  }

  function refresh() {
    const lang = el("language").value;
    const copy = strings[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
    document.title = copy.title;
    document.querySelectorAll("[data-copy]").forEach(n => { n.textContent = copy[n.dataset.copy]; });
    const k = Number(el("parameter").value);
    const m = 14 * k;
    el("summary").textContent = copy.summary(m, 15 * m, k);
    drawStar(m);
    el("module-title").textContent = copy.moduleTitle;
    el("star-title").textContent = copy.starTitle(m);
  }

  for (let k = 1; k <= 10; k++) el("parameter").add(new Option("k = " + k, k));
  el("parameter").addEventListener("change", refresh);
  el("language").addEventListener("change", refresh);
  el("zoom").addEventListener("change", () => {
    document.documentElement.style.setProperty("--zoom", el("zoom").value);
  });
  drawModule();
  refresh();
</script>
</body>
</html>
