  strings["pt"] = {"title": "A família de contraexemplos de diâmetro 10", "intro": "Repetimos e conectamos um módulo pequeno para construir árvores que ultrapassam a cota arredondada para cima. Os dois diagramas mostram como.", "parameter": "Parâmetro k", "zoom": "Ampliação", "module": "Etapa 1: um módulo de 15 vértices", "star": "Etapa 2: ligar os centros", "moduleTitle": "Um módulo: um centro ligado aos pontos médios de dois caminhos de sete vértices", "moduleCaption": "Ligamos os pontos médios de dois caminhos disjuntos de sete vértices a um centro comum. São 1 + 2 × 7 = 15 vértices; uma extremidade mais distante fica a 4 arestas do centro.", "starCaption": "Cada ponto representa o centro de um módulo existente, não todos os vértices da árvore. Acrescentam-se apenas arestas entre centros; o laranja marca a ligação de dois módulos externos ao centro da estrela.", "diameter": "Por que o diâmetro é exatamente 10?", "distance": "Entre dois vértices, um caminho percorre no máximo 4 arestas no primeiro módulo, 2 na estrela e 4 no último. As extremidades mais distantes dos dois módulos externos destacados dão exatamente 4 + 2 + 4 = 10.", "bound": "A construção vale para todo inteiro positivo k. 91k é uma cota inferior para qualquer primeiro jogador, não um valor exato. Aqui é possível visualizar k de 1 a 10.", "proof": "Leia a prova da estratégia no apêndice B", "language": "Idioma", "eyebrow": "Matemática interativa · construção de um contraexemplo", "step1Title": "1 · Construir um módulo", "step1": "Dois caminhos de sete vértices e um centro comum somam 15 vértices.", "step2Title": "2 · Formar uma árvore", "step2": "Use 14k módulos e ligue seus centros existentes em estrela, sem adicionar vértices.", "step3Title": "3 · Comparar jogadas", "step3": "A prova fornece pelo menos 91k jogadas; a cota de referência é 90k.", "gameLink": "← Voltar ao jogo", "homeLink": "Página inicial do projeto"};
  strings["pt"].summary = (m,n,k) => m + " módulos × 15 vértices = " + n + " vértices · diâmetro 10 · pelo menos " + 91*k + " jogadas, referência " + 90*k;
  strings["pt"].starTitle = m => "Estrela de " + m + " centros, com duas ligações externas destacadas";
  const el = id => document.getElementById(id);
  const svg = (tag, attrs) => {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  };
  const edge = ([x1, y1], [x2, y2], highlight) =>
    svg("line", { x1, y1, x2, y2, class: highlight ? "route" : "" });
  const vertex = ([cx, cy], r, className = "") => svg("circle", { cx, cy, r, class: className });

  function drawModule() {
    const center = [72, 150];
    const gates = [[171, 81], [171, 219]];
    const marks = [vertex(center, 12, "hub")];
    const edges = [];
    for (const [i, gate] of gates.entries()) {
      edges.push(edge(center, gate, i === 0));
      marks.push(vertex(gate, 9, "gate"));
      for (const [arm, y] of [gate[1] - 39, gate[1] + 39].entries()) {
        const highlight = i === 0 && arm === 0;
        let parent = gate;
        for (const x of [255, 340, 424]) {
          const point = [x, y];
          edges.push(edge(parent, point, highlight));
          marks.push(vertex(point, 7, highlight && x === 424 ? "leaf" : ""));
          parent = point;
        }
      }
    }
    el("module").append(...edges, ...marks);
  }

  function drawStar(m) {
    const center = [200, 150];
    const outer = Array.from({ length: m - 1 }, (_, i) => {
      const angle = 2 * Math.PI * i / (m - 1) - Math.PI / 2;
      return [center[0] + 123 * Math.cos(angle), center[1] + 123 * Math.sin(angle)];
    });
    const selected = i => i === 0 || i === Math.floor((m - 1) / 2);
    const edges = outer.map((point, i) => edge(center, point, selected(i)));
    const marks = outer.map((point, i) => vertex(point, selected(i) ? 7 : Math.min(4, 200 / m), selected(i) ? "leaf" : ""));
    el("star").replaceChildren(el("star-title"), ...edges, vertex(center, 12, "hub"), ...marks);
  }

  function refresh() {
    const lang = el("language").value;
    const copy = strings[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    el("language").setAttribute("aria-label", copy.language);
    el("game-link").href = "index.html?lang=" + encodeURIComponent(lang);
    document.title = copy.title;
    document.querySelectorAll("[data-copy]").forEach(n => { n.textContent = copy[n.dataset.copy]; });
    const k = Number(el("parameter").value);
    const m = 14 * k;
    el("summary").textContent = copy.summary(m, 15 * m, k);
    drawStar(m);
    el("module-title").textContent = copy.moduleTitle;
    el("star-title").textContent = copy.starTitle(m);
  }

  for (let k = 1; k <= 10; k++) el("parameter").add(new Option("k = " + k, k));
  el("parameter").addEventListener("change", refresh);
  el("language").addEventListener("change", refresh);
  el("zoom").addEventListener("change", () => {
    document.documentElement.style.setProperty("--zoom", el("zoom").value);
  });
  const requestedLanguage = new URLSearchParams(location.search).get("lang");
  if (requestedLanguage && strings[requestedLanguage]) el("language").value = requestedLanguage;
  drawModule();
  refresh();
</script>
