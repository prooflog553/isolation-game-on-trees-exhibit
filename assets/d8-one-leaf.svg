<title id="title">One added leaf changes the conjecture</title>
<desc id="desc">Two exact tree diagrams use the same vertex labels as check_ai_case_p9_d8.py. Center 0 connects to midpoints 4, 11, and 18 of three seven-vertex paths. The right tree adds only edge 0 to 22. The trees have 22 and 23 vertices, both diameter 8. Their optimal free Dominator-start values are 9 and 10, while a forced center opening takes 10 in both.</desc>
