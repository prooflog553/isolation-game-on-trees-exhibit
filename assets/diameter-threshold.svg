<text x="361" y="163" font-size="104" font-weight="700" fill="#77efdc">≤9</text>
<text x="679" y="163" font-size="104" font-weight="700" fill="#ffb391">10</text>
<path d="M231 195h578" stroke="url(#bar)" stroke-width="3" stroke-linecap="round"/>
<path d="M520 81v93m0 41v53" stroke="#5e6e8a" stroke-width="2" stroke-dasharray="3 7"/>
<circle cx="520" cy="195" r="6" fill="#e0d9ea"/>
<text x="361" y="253" font-size="30" fill="#e2f5f4">⌈3n / 7⌉</text>
<text x="679" y="253" font-size="30" fill="#ffe8dd">91k &gt; 90k</text>
