<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
<title id="title">A sharp diameter threshold: 9 to 10</title>
<desc id="desc">The rounded upper bound holds through diameter 9 for Dominator-start play. At diameter 10 the family gives at least 91k moves, exceeding 90k under either starting convention. Network motifs are decorative.</desc>
<defs>
