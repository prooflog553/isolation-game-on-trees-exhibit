<linearGradient id="bar"><stop stop-color="#55e0c8"/><stop offset="1" stop-color="#ffac7f"/></linearGradient>
</defs>
<rect x="2" y="2" width="1036" height="316" rx="30" fill="url(#bg)" stroke="#394966" stroke-width="2"/>
<g fill="none" stroke="#30445c" stroke-width="2">
<path d="M22 94 85 68l52 49-38 57 41 65-76 23-42-46m63-148 26-40m-12 146-70 8m70-8 61 4m-20 61 42 35M1017 94l-62-26-52 49 38 57-41 65 76 23 42-46m-63-148-26-40m12 146 70 8m-70-8-61 4m20 61-42 35"/>
</g>
<g fill="#516783"><circle cx="85" cy="68" r="5"/><circle cx="137" cy="117" r="5"/><circle cx="99" cy="174" r="6"/><circle cx="140" cy="239" r="5"/><circle cx="64" cy="262" r="5"/><circle cx="955" cy="68" r="5"/><circle cx="903" cy="117" r="5"/><circle cx="941" cy="174" r="6"/><circle cx="900" cy="239" r="5"/><circle cx="976" cy="262" r="5"/></g>
<g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
