<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 285" role="img"><title>A module of the diameter-ten family</title><desc>Outer centre with two gates, each bearing two arms of length three.</desc><rect width="780" height="285" fill="#f6f5ee"/><g stroke="#58766a" stroke-width="3"><path d="M105,132 L228,66"/><path d="M105,132 L228,197"/><path d="M228,66 L311,40"/><path d="M311,40 L373,40"/><path d="M373,40 L435,40"/><path d="M228,66 L311,94"/><path d="M311,94 L373,94"/><path d="M373,94 L435,94"/><path d="M228,197 L311,171"/><path d="M311,171 L373,171"/><path d="M373,171 L435,171"/><path d="M228,197 L311,227"/><path d="M311,227 L373,227"/><path d="M373,227 L435,227"/></g><circle cx="105" cy="132" r="7" fill="#994720"/><circle cx="228" cy="66" r="7" fill="#994720"/><circle cx="228" cy="197" r="7" fill="#295e4d"/><circle cx="311" cy="40" r="7" fill="#295e4d"/><circle cx="373" cy="40" r="7" fill="#295e4d"/><circle cx="435" cy="40" r="7" fill="#295e4d"/><circle cx="311" cy="94" r="7" fill="#295e4d"/><circle cx="373" cy="94" r="7" fill="#295e4d"/><circle cx="435" cy="94" r="7" fill="#295e4d"/><circle cx="311" cy="171" r="7" fill="#295e4d"/><circle cx="373" cy="171" r="7" fill="#295e4d"/><circle cx="435" cy="171" r="7" fill="#295e4d"/><circle cx="311" cy="227" r="7" fill="#295e4d"/><circle cx="373" cy="227" r="7" fill="#295e4d"/><circle cx="435" cy="227" r="7" fill="#295e4d"/><g font-family="sans-serif" fill="#1c483a" font-size="16"><text x="22" y="111">centre</text><text x="187" y="37">gate</text><text x="45" y="266">15 vertices per module</text><text x="490" y="74">14k centres form a star</text><text x="490" y="111">15 · 14k = 210k vertices</text><text x="490" y="172">tip → centre: 4 edges</text><text x="490" y="209">leaf to leaf: 4 + 2 + 4 = 10</text></g></svg>
